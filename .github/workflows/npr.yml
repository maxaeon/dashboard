name: Fetch NPR headlines

on:
  schedule:
    - cron: "15 10 * * *"   # 10:15 UTC, about 6:15 am Eastern
  workflow_dispatch:

# The repo must also allow this: Settings, Actions, General, Workflow permissions, "Read and write permissions".
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_npr.py
      - name: Commit
        run: |
          git config user.name "npr-bot"
          git config user.email "npr-bot@users.noreply.github.com"
          git add data/npr.json
          git diff --cached --quiet || git commit -m "Update NPR headlines"
          git pull --rebase
          git push
